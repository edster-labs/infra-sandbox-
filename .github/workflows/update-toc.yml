name: Generate Table of Contents

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.md'

jobs:
  toc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Runtime Env
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Auto-Scan Folders and Rebuild Matrix Directories
        run: python build_indices.py

      - name: Commit Updated Dashboard Layout
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automation: Auto-scan files and rebuild workspace matrices [skip ci]"
