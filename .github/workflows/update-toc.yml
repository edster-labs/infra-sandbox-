name: Generate Table of Contents

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # 1. Trigger the automation whenever ANY file changes anywhere in the repo
    paths:
      - '**/*.md'

jobs:
  toc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Calculate and Rebuild Markdown TOC
        uses: technote-space/toc-generator@v4
        with:
          MAX_HEADER_LEVEL: 3
          TOC_TITLE: ""
          # 2. Tell the engine to update the README files inside EVERY subfolder automatically
          TARGET_PATHS: |
            README.md
            cheat-sheets/README.md
            eve-ng-guides/README.md
            network-labs/README.md
            sec-notebook/README.md
          MODE: github

      - name: Commit Updated Dashboard Layout
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automation: Auto-generate matrix navigation paths [skip ci]"
