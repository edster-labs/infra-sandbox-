<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP MSS Clamping Visualizer</title>
    <style>
        /* ==========================================================================
           🌌 GLOBAL DARK THEME & ACCESSIBILITY ARCHITECTURE OVERRIDES
           ========================================================================== */

        body {
            background-color: #0f172a !important; /* Premium Midnight Dark Slate */
            color: #cbd5e1 !important;            /* Balanced off-white text to reduce glare */
            line-height: 1.6 !important;
            margin: 0 !important;
            padding: 0 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #ffffff !important;
            font-weight: 700 !important;
        }

        strong, b {
            color: #f1f5f9 !important;
        }

        .container, .wrapper, #main_content, main {
            background-color: #0f172a !important; 
            margin-left: auto !important;
            margin-right: auto !important;
            text-align: left;
        }

        a {
            color: #38bdf8 !important; /* Radiating sky blue links */
            text-decoration: none !important;
        }

        a:hover, a:active {
            color: #60a5fa !important; /* Transitions to lighter blue on click/hover */
            text-decoration: underline !important;
        }

        /* ==========================================================================
           📱 MOBILE REFRESH: GLOBAL TOP THEME NAVBAR BUTTON CONTROLS
           ========================================================================== */

        header, .site-header, #project_title, .project-name, .site-nav-header {
            background-color: #1e293b !important; /* Subtle lighter slate header card wrapper */
            border-bottom: 1px solid #334155 !important;
            padding: 16px 24px !important;
            margin-bottom: 30px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        header a, .site-header a, .project-name a, body > header h1 a, .site-nav-header a {
            color: #ffffff !important; /* Crisp pure white home text link */
            font-weight: 700 !important;
            font-size: 18px !important;
        }

        header a:hover, .site-nav-header a:hover {
            color: #38bdf8 !important;
        }

        /* ==========================================================================
           🎨 CUSTOM INTERACTIVE VISUALIZER COMPONENTS
           ========================================================================== */

        :root {
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-orange: #fb923c;
            --border: #334155;
        }

        .visualizer-wrapper {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 0 2rem 2rem 2rem;
            box-sizing: border-box;
        }

        .dashboard-card {
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        /* Flex wrap layout to neatly arrange state toggles and playback keys */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
        }

        .playback-controls {
            display: flex;
            gap: 0.5rem;
            background: #111827;
            padding: 0.4rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .btn {
            background: #273549;
            border: 1px solid var(--border);
            color: #f8fafc;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #334155;
        }

        .btn.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .btn.active.clamped {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 2px rgba(251, 146, 60, 0.2);
        }

        .btn-playback {
            background: #1e293b;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 4px;
        }

        .network-track {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3.5rem 2rem;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .wire-line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 4px;
            background: #4b5563;
            z-index: 1;
            transform: translateY(-50%);
        }

        .wire-line.active-pulse {
            background: linear-gradient(90deg, var(--accent-blue) 0%, var(--accent-orange) 50%, var(--accent-green) 100%);
        }

        .node {
            position: relative;
            background: #1e293b;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            width: 140px;
            z-index: 2;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .node:hover, .node.active-hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .node-title {
            font-weight: bold;
            display: block;
            margin-bottom: 0.25rem;
        }

        .node-subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .packet-transit {
            position: absolute;
            top: 50%;
            left: 15%;
            transform: translate(-50%, -50%);
            background: var(--accent-blue);
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 3;
            pointer-events: none;
            box-shadow: 0 0 12px var(--accent-blue);
            opacity: 0;
            white-space: nowrap;
        }

        .packet-transit.clamped-state {
            background: var(--accent-orange);
            box-shadow: 0 0 12px var(--accent-orange);
        }

        .details-panel {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 100px;
        }

        .details-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .details-tag-size {
            font-size: 0.85rem;
            background: #1e293b;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            color: var(--accent-blue);
            border: 1px solid var(--border);
        }

        .details-desc {
            margin: 0;
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- 🌐 Absolute path matching your working file target -->
    <div class="site-nav-header">
        <a href="/infra-sandbox-/">infra-sandbox-</a>
    </div>

    <div class="visualizer-wrapper">
        <div class="dashboard-card">
            <h1>TCP MSS Clamping Flow Visualizer</h1>
            <p class="subtitle">Simulate how intermediate VPN links actively intercept and rewrite transit TCP headers to prevent Layer-3 fragmentation.</p>

            <!-- Layout Row containing both Mode Toggles and Timeline Playback controls -->
            <div class="controls-row">
                <div class="controls">
                    <button id="btn-standard" class="btn active">Standard Path (1460 B)</button>
                    <button id="btn-clamp" class="btn">MSS Clamping Path (1360 B)</button>
                </div>
                
                <div class="playback-controls">
                    <button id="btn-play" class="btn btn-playback">▶ Play</button>
                    <button id="btn-pause" class="btn btn-playback">⏸ Pause</button>
                    <button id="btn-reset" class="btn btn-playback">🔄 Reset</button>
                </div>
            </div>

            <div class="network-track">
                <div id="wire-track" class="wire-line"></div>
                <div id="packet" class="packet-transit">SYN: MSS 1460</div>

                <div id="node-a" class="node">
                    <span class="node-title">Host A</span>
                    <span class="node-subtitle">Source Initiator</span>
                </div>
                
                <div id="node-router" class="node">
                    <span class="node-title">VPN Router</span>
                    <span class="node-subtitle">Transit Middlebox</span>
                </div>
